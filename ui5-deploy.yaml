# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: gabc.vreport.vreport
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DS4_110
          url: http://s4hana-ds4:44300
          client: '110'
        app:
          name: ZVREPORT_BSP
          description: Voucher Report Fiori Application
          package: ZGJ_VOUCH_REPORT
          transport: DS4K900738
        exclude:
          - /test/
